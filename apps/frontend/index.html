<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10140D" />
    <title>Studio Meadow</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="welcome-scene" class="scene scene-copy active" aria-labelledby="welcome-title">
        <div class="brand-mark large" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 13.5c1.4 0 2.5-1.1 2.5-2.5S13.4 8.5 12 8.5 9.5 9.6 9.5 11s1.1 2.5 2.5 2.5Z" />
            <path d="M12 8.5C9.8 5.8 10.4 3 12 3s2.2 2.8 0 5.5Z" />
            <path d="M14.4 10.2c.5-3.4 2.9-4.8 4-3.7s-.3 3.5-3.7 4Z" />
            <path d="M14 13c3.3.6 4.6 3 3.5 4.1s-3.5-.2-4-3.5Z" />
            <path d="M10 13c-.6 3.3-3 4.6-4.1 3.5s.2-3.5 3.5-4Z" />
            <path d="M9.6 10.2c-3.4-.5-4.8-2.9-3.7-4s3.5.3 4 3.7Z" />
            <path d="M12 13.5V21" />
            <path d="M12 18c1.7-1.6 3.3-1.9 4.7-.9-1.2 1.7-2.8 2.1-4.7.9Z" />
          </svg>
        </div>
        <div class="copy-block">
          <h1 id="welcome-title">Welcome to Studio Meadow.</h1>
          <p>Every bloom keeps its own rhythm. What shape will yours take tonight?</p>
        </div>
        <button id="start-button" class="circle-button" type="button" aria-label="Begin drawing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></svg>
        </button>
      </section>

      <section id="drawing-scene" class="scene panel" aria-label="Draw your flower">
        <div class="canvas-frame">
          <div class="stem-guide" aria-hidden="true"></div>
          <canvas id="drawing-canvas" class="drawing-canvas" aria-label="Flower drawing canvas"></canvas>
        </div>

        <div class="tools-row" aria-label="Drawing tools">
          <button id="undo-button" class="icon-button" type="button" title="Undo" aria-label="Undo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4v5" /><path d="M4.5 12A7.5 7.5 0 1 0 7 6.4L4 9.4" /></svg>
          </button>
          <button id="clear-button" class="icon-button" type="button" title="Clear" aria-label="Clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="m9 11 .5 7" /><path d="m15 11-.5 7" /><path d="M6 6l1 15h10l1-15" /></svg>
          </button>
          <label class="brush-control" for="brush-size">
            <svg viewBox="0 0 24 24" role="img">
              <path d="m7 16 9.5-9.5a2.1 2.1 0 0 1 3 3L10 19H5v-5Z" />
              <path d="M13.5 9.5 16.5 12.5" />
            </svg>
            <input id="brush-size" type="range" min="8" max="42" value="18" aria-label="Brush size" />
          </label>
        </div>

        <div id="palette" class="palette" aria-label="Color palette"></div>

        <button id="submit-button" class="submit-button" type="button" disabled>
          <svg id="submit-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></svg>
          <span id="submit-label">Send flower</span>
        </button>

        <p id="status-message" class="status-message" aria-live="polite"></p>
      </section>

      <section id="thanks-scene" class="scene scene-copy" aria-labelledby="thanks-title">
        <div class="brand-mark large" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 13.5c1.4 0 2.5-1.1 2.5-2.5S13.4 8.5 12 8.5 9.5 9.6 9.5 11s1.1 2.5 2.5 2.5Z" />
            <path d="M12 8.5C9.8 5.8 10.4 3 12 3s2.2 2.8 0 5.5Z" />
            <path d="M14.4 10.2c.5-3.4 2.9-4.8 4-3.7s-.3 3.5-3.7 4Z" />
            <path d="M14 13c3.3.6 4.6 3 3.5 4.1s-3.5-.2-4-3.5Z" />
            <path d="M10 13c-.6 3.3-3 4.6-4.1 3.5s.2-3.5 3.5-4Z" />
            <path d="M9.6 10.2c-3.4-.5-4.8-2.9-3.7-4s3.5.3 4 3.7Z" />
            <path d="M12 13.5V21" />
            <path d="M12 18c1.7-1.6 3.3-1.9 4.7-.9-1.2 1.7-2.8 2.1-4.7.9Z" />
          </svg>
        </div>
        <div class="copy-block">
          <h1 id="thanks-title">Thank you.</h1>
          <p>The meadow is wide, and still your bloom will find its light.</p>
        </div>
        <div class="final-actions">
          <a class="home-link" href="https://www.instagram.com/studio.meadow.la/" target="_blank" rel="noreferrer">
            Visit Studio Meadow
          </a>
          <button id="draw-another-button" class="home-link secondary" type="button">Draw Another</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
